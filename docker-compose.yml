version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql-db:
    image: mysql:8.0
    container_name: sih-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sih_db
      MYSQL_ROOT_PASSWORD: rootpassword
    # ports:
    #   - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sih-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI AI Demand Forecasting Service
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: sih-ai-service
    restart: always
    ports:
      - "8000:8000"
    networks:
      - sih-network

  # 3. Spring Boot 3 Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/sih_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8088:8088"
    networks:
      - sih-network

volumes:
  mysql_data:

networks:
  sih-network:
    driver: bridge
