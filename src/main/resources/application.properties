# ==========================================================
# Spring Boot Configuration - Worker Registration System
# ==========================================================

spring.application.name=worker-registration
server.port=${PORT:${SERVER_PORT:8088}}

# ==========================================================
# MySQL Database Connection Settings
# Configurable via environment variables or .env file:
# SPRING_DATASOURCE_URL or DB_URL
# SPRING_DATASOURCE_USERNAME or DB_USERNAME
# SPRING_DATASOURCE_PASSWORD or DB_PASSWORD
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3307/sih_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Injmam@089}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================================
# JPA / Hibernate Configuration
# 'update' automatically updates/creates tables based on Entity classes
# ==========================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Static Resource Mapping (Frontend HTML/CSS/JS)
# ==========================================================
spring.web.resources.static-locations=classpath:/static/

# ==========================================================
# Transactional Email / Brevo SMTP Configuration for Real OTP
# Configure credentials via environment variables:
# MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@cooperativegig.com}
app.mail.from-name=${MAIL_FROM_NAME:Cooperative Gig Services}
app.mail.enabled=${MAIL_ENABLED:true}
