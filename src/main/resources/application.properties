# ==========================================================
# Spring Boot Configuration - Worker Registration System
# ==========================================================

spring.application.name=worker-registration
server.port=8080

# ==========================================================
# MySQL Database Connection Settings
# Change username and password to match your local MySQL setup
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3307/sih_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Injmam@089
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / Hibernate Configuration
# 'update' automatically updates/creates tables based on Entity classes
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Static Resource Mapping (Frontend HTML/CSS/JS)
# ==========================================================
spring.web.resources.static-locations=classpath:/static/
